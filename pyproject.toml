[project]
name = "tracey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alex", email = "alex.mors@theapic.de" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "potracer>=0.0.4",
    "pyside6>=6.11.2",
]

[project.scripts]
potrace = "tracey.app:main"
tracey = "tracey.ui:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = [
    "ANN", # type hints on every function definition
    "I",   # import sorting
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"] # scripts report with print

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev", "build"]
