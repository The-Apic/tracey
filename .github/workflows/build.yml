name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format github
      - run: uv run ruff format --check
      - run: uv run ty check --output-format github

  build:
    name: Build ${{ matrix.target }}
    needs: check
    # executables only for main, tags and manual runs, not for every pull request
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest # Apple silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --group build
      - run: uv run --no-sync scripts/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: Tracey-${{ matrix.target }}
          path: dist/Tracey-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
